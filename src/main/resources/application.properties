spring.application.name=youaudit

# Banco H2 em ARQUIVO, para o cache_ia (e os produtos) sobreviverem a um reinício: a demo não depende da API no ar.
# Fica em data/real/db/ porque guarda texto de páginas reais (data/real/ está no .gitignore).
# Quer começar do zero? Desligue a aplicação e apague a pasta data/real/db/.
# Os testes usam um banco em memória: src/test/resources/config/application.properties.
spring.datasource.url=jdbc:h2:file:./data/real/db/youaudit
spring.datasource.username=sa
spring.datasource.password=
# Console web do banco: http://localhost:8080/h2-console (JDBC URL acima)
spring.h2.console.enabled=true

# O Hibernate cria as tabelas e colunas que faltam, sem apagar dados. Limite: não remove nem altera colunas;
# se mudar uma entidade de forma incompatível (ex.: renomear campo), apague data/real/db/.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Roda o data.sql (regras e pesos iniciais) DEPOIS de o Hibernate criar as tabelas. Roda a cada início: por isso usa MERGE.
spring.jpa.defer-datasource-initialization=true

# Gemini: a chave vem SOMENTE da variável de ambiente GEMINI_API_KEY (vazia se não definida).
gemini.api-key=${GEMINI_API_KEY:}
# Nome do modelo. Em 25/11/2026 a API recusou o gemini-2.5-flash ("no longer available to new users")
# e indicou este. Trocou o modelo? As respostas antigas do cache deixam de valer (o modelo entra na chave).
gemini.model=gemini-3.8-flash
# Modelo do cruzamento com a entrega e da redação. 26/11: a cota gratuita é de 20 chamadas/dia POR MODELO, então a
# extração (o que medimos contra o gabarito) fica sozinha no modelo acima e o resto usa este (ver config.IaConfig).
gemini.model-secundario=gemini-3.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-ms=30000
# Erro de rede, 429 ou 5xx: 2 novas tentativas (1 s, depois 2 s) e então falha.
gemini.tentativas-extras=2
gemini.espera-entre-tentativas-ms=1000

# Preparação do texto em blocos numerados (PreparadorBlocos).
extracao.max-caracteres-bloco=1200
extracao.max-caracteres-chamada=8000

# Coleta de páginas por URL (ColetorPagina).
coleta.user-agent=YouAudit-prototipo/0.1 (projeto academico; coleta pontual de paginas publicas)
coleta.timeout-ms=10000
# No máximo 1 requisição por segundo, contando o robots.txt.
coleta.intervalo-minimo-ms=1000
# Texto limpo com menos caracteres que isto: auditoria COLETA_INSUFICIENTE.
coleta.minimo-caracteres=500
# Cópias das páginas reais: dentro de data/real/, que está no .gitignore.
coleta.diretorio-snapshots=data/real/snapshots
# Proteção contra SSRF: IPs exatos liberados. SÓ PARA TESTES; deixe vazio.
coleta.ips-liberados-para-teste=

# Lote de links reais (POST /api/lote/urls). Formato: uma linha "pagina-01 https://..." por página.
lote.arquivo-urls=data/real/urls.txt
lote.intervalo-ms=1000

# Pontuação (pontuacao.CalculadoraPontuacao). Os PESOS ficam na tabela regra (data.sql); aqui só as faixas.
# BAIXA 0–29, MEDIA 30–59, ALTA 60–100 (CONTRATOS.md §2). A soma é limitada ao máximo.
pontuacao.inicio-media=30
pontuacao.inicio-alta=60
pontuacao.maximo=100

# Pipeline assíncrono (evento.ProcessadorAuditoria). Páginas REAIS não rodam sozinhas: só pelo
# POST /api/produtos/{id}/processar, para as RESERVADO só passarem pela IA depois do congelamento (PLANO.md, Dia 3).
pipeline.processar-real-automaticamente=false

# Mostra a mensagem das exceções no corpo do erro (ex.: "a auditoria ainda está em análise"). As mensagens do
# projeto nunca têm URL, chave nem texto de página.
server.error.include-message=always

# Simulador (gatilho SIMULADO da demo): produtos fictícios em data/simulado/, um evento a cada intervalo.
simulador.arquivo=data/simulado/produtos.json
simulador.intervalo-ms=1500

# Avaliação (avaliacao.ServicoComparativo). O gabarito é do Eduardo e fica fora do Git (data/real/).
avaliacao.gabarito-afirmacoes=data/real/rotulos/afirmacoes.csv
