# Só para os testes. O Spring lê classpath:/config/application.properties DEPOIS do application.properties
# principal, e estas chaves têm prioridade; as outras continuam vindo do arquivo principal.
# Testes rodam em memória e do zero: não tocam no banco em arquivo da demo (data/real/db/).
spring.datasource.url=jdbc:h2:mem:youaudit-teste;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
